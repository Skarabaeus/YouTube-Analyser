# Hooks required by INSTRUCTIONS.md §2. Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: security-review
        name: claude security review (staged diff)
        entry: scripts/security-review-hook.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]
