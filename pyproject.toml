[project]
name = "yta"
version = "0.1.0"
description = "Local MCP server exposing YouTube Studio export analytics to MCP clients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "duckdb>=2.0,<3",
]

[project.scripts]
yta-mcp = "yta.mcp_server:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "pip-audit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yta"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
